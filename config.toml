[search]
backend = "duckduckgo"
region = "en_uk"
max_results = 10

[data]
db = "~/src/cv/data/web.sqlite"

[[agents]]
key_cmd = "pass dev/deepseek.com/key"
version = "deepseek-v4-flash"
thinking = false
task = "Find remote software development jobs and save them to db."
system_prompt = ""
instructions = ""
threads = 10
