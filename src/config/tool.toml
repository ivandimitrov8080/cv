brief = """
Backend and Java work, contract preferred, remote in the EU or relocation.
"""

[db]
path = "../webpipe.db"
schema = "schema.sql"
table = "item"
key = "url"
memo = "memo"
states = { new = "NEW", working = "WORKING", review = "NEEDS_REVIEW" }

[model]
name = "deepseek-chat"
key_var = "DEEPSEEK_API_KEY"

[ingest]
prompt = "prompts/ingest.md"
workers = 2
steps = 26
seeds_per_session = 1
queries_per_session = 2
pause = 2
idle = 300
ttl = { url = 7, query = 30 }
seeds = [
  "https://remotive.com/remote-jobs/software-dev",
]
queries = [
  "java backend contract remote eu",
  "site:greenhouse.io java backend",
]

[act]
prompt = "prompts/act.md"
workers = 1
steps = 120
lease = 1800
browser = true
notes = "../../data/application-questions.org"
guarded = ["applied"]
outcomes = { applied = "ACTIVE", retry = "NEW", hold = "HOLD", archive = "ARCHIVED" }
