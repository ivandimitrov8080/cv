[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpipe"
version = "0.2.0"
description = "One agent ingests rows into a sqlite queue, another works them"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "mcp>=2.3",
  "peewee>=3.17",
  "rapidfuzz>=3.9",
  "trafilatura>=1.9",
]

[project.scripts]
webpipe = "lib:main"

# The sources live in src/, so setuptools needs to be told where the package
# root is; `lib` is the only importable package.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["lib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
