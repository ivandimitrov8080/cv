[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itempipe"
version = "0.1.0"
description = "Two agents, one SQLite queue: search leads, apply to them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "mcp>=2.3",                # the MCP client `itempipe apply` spawns playwright-mcp with
  "peewee>=3.17",
  "rapidfuzz>=3.9",          # the fuzzy finder application questions are matched with
  "rich>=13.7",
  "trafilatura>=1.9",
]

[project.scripts]
itempipe = "itempipe:main"

[tool.setuptools]
packages = ["itempipe"]

[tool.setuptools.package-data]
itempipe = ["prompts/*.md", "search.toml", "schema.sql"]
