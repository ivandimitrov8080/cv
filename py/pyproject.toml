[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itempipe"
version = "0.1.0"
description = "Two agents, one SQLite queue: search leads, apply to them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.0.5",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "peewee>=3.17",
  "rich>=13.7",
  "trafilatura>=1.9",
]

[project.scripts]
itempipe = "itempipe:main"

[tool.setuptools]
packages = ["itempipe"]

[tool.setuptools.package-data]
itempipe = ["prompts/*.md", "search.toml"]
