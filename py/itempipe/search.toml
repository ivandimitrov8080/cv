# What itempipe searches for.
#
# Everything about the job market lives in this file — the roles, the regions, the boards,
# the sites. The Python module holds none of it: it only turns this into queries and
# tasks, so changing what you look for never means editing code. Point ITEMPIPE_CONFIG at
# another file to keep several of these (one per kind of job you are hunting).

# Filled into any {name} in the board URLs below.
[vars]
hn_thread = "49922569"          # this month's "Ask HN: Who is hiring?"

[search]

# What to search for. Free text: add as many phrases as you want, this is the width of
# the search. One entry per role you would actually take.
roles = [
  "java spring boot",
  "java developer",
  "java backend",
  "backend engineer",
  "full stack developer",
  "kotlin developer",
  "jvm backend",
  "software engineer",
]

# Seniority prefixes to try in front of each role. "" means the bare role.
seniority = ["", "senior ", "staff ", "lead "]

# Industries to cross with every role above, e.g. ["crypto", "fintech", "climate",
# "healthtech"]. Empty means only the roles themselves are searched.
domains = []

# How a posting is normally announced.
phrases = ["hiring", "open role", "jobs", "careers"]

# The same, for contract work.
contract_phrases = ["contract", "b2b", "freelance", "day rate"]

# Hosts swept with site:, i.e. where companies actually put their postings. The ATSs are
# how you reach the small companies that never touch a job board; the boards are how you
# reach the regional markets.
sites = [
  "jobs.ashbyhq.com",
  "jobs.lever.co",
  "jobs.eu.lever.co",
  "boards.greenhouse.io",
  "job-boards.greenhouse.io",
  "apply.workable.com",
  "jobs.personio.de",
  "join.com",
  "careers.teamtailor.com",
  "recruitee.com",
  "breezy.hr",
  "jobs.smartrecruiters.com",
  "himalayas.app",
  "otta.com",
  "welcometothejungle.com",
  "nofluffjobs.com",
  "justjoin.it",
  "bulldogjob.pl",
  "pracuj.pl",
  "djinni.co",
  "dou.ua",
  "hh.ru",
  "germantechjobs.de",
  "berlinstartupjobs.com",
  "stepstone.de",
  "indeed.com",
  "glassdoor.com",
  "linkedin.com/jobs/view",
  "remoteok.com",
  "remotive.com",
  "weworkremotely.com",
  "arbeitnow.com",
  "hackernews.com",
]

# Where. Groups are interleaved, never walked in order, so a worker cannot drift into one
# country because it happened to start there.
[search.regions]
remote = [
  "remote europe", "remote eu", "remote emea", "europe remote",
  "remote worldwide", "work from anywhere", "fully remote",
]
west = [
  "germany", "netherlands", "austria", "switzerland", "ireland", "france",
  "belgium", "luxembourg", "denmark", "sweden", "norway", "finland", "iceland",
]
uk = ["united kingdom", "scotland", "wales"]
east = [
