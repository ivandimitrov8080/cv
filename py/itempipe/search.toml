# Handed to the agent verbatim. This is the part that knows who is job-hunting: what they
# will accept, where they can work from, what to skip.
notes = """
Fully remote, EU-remote, or a contract with no residency requirement. This person is based
in Bulgaria and can also work from Czechia. Skip onsite-only and hybrid roles, and any
posting that requires a work permit for a country they are not in.
"""

# The default task queue: consumed by whichever worker asks first, then left behind until
# its TTL. Add your own with a label and one or more URLs.
[[boards]]
label = "HN who is hiring"
urls = [
  "https://news.ycombinator.com/item?id={hn_thread}",
  "https://hnhiring.com/technologies/java",
  "https://hnhiring.com/technologies/react",
]

[[boards]]
label = "YC work at a startup"
