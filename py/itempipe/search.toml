americas = [
  "united states", "canada", "mexico", "brazil", "argentina", "chile",
  "colombia", "uruguay", "costa rica",
]
world = [
  "united arab emirates", "israel", "turkey", "armenia", "singapore", "japan",
  "south korea", "australia", "new zealand", "india", "south africa", "kenya",
]

# The same for cities, used in "<role>" "<city>" careers queries. Also interleaved.
[search.cities]
uk_ie = ["london", "manchester", "edinburgh", "bristol", "dublin", "belfast"]
north = [
